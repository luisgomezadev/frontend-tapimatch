<header
  class="fixed inset-x-0 top-0 z-50 bg-white backdrop-blur-xl border-b border-gray-200 shadow-sm transition-all duration-300 py-3">

  <div class="max-w-7xl mx-auto px-4 lg:px-6">
    <div class="flex items-center justify-between h-18">

      <a
        routerLink="/"
        (click)="closeMenu()"
        class="flex items-center gap-3 group">
        
        <img
          src="assets/logo_letras.webp"
          alt="TapiMatch"
          class="w-28 md:w-36 transition-transform duration-300 group-hover:scale-105" />
      </a>

      <!-- Navegación desktop -->
      <nav class="hidden md:flex items-center gap-2">

        <a
          routerLink="/login"
          routerLinkActive="text-primary bg-gray-100"
          class="px-5 py-2.5 rounded-lg text-sm font-medium text-gray-700 hover:bg-gray-100 hover:text-primary transition-all duration-200">
          Iniciar sesión
        </a>

        <a
          routerLink="/registro"
          routerLinkActive="text-primary bg-gray-100"
          class="px-5 py-2.5 rounded-lg text-sm font-medium text-gray-700 hover:bg-gray-100 hover:text-primary transition-all duration-200">
          Crear cuenta
        </a>

        <a
          routerLink="/canchas"
          routerLinkActive="opacity-100"
          class="ml-2 inline-flex items-center justify-center rounded-lg bg-primary px-7 py-3 text-sm font-semibold text-white shadow-sm hover:bg-hover-primary hover:shadow-md transition-all duration-300">
          Ver canchas
        </a>

      </nav>

      <!-- Botón hamburguesa → X -->
      <button
        type="button"
        (click)="toggleMenu()"
        [attr.aria-label]="menuOpen ? 'Cerrar menú' : 'Abrir menú'"
        [attr.aria-expanded]="menuOpen"
        aria-controls="mobile-menu"
        class="md:hidden p-2 rounded-lg text-gray-700 hover:bg-gray-100 hover:text-primary focus-visible:outline-2 focus-visible:outline-primary transition">

        <svg
          xmlns="http://www.w3.org/2000/svg"
          class="w-6 h-6"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          aria-hidden="true">

          <!-- Línea superior -->
          <line
            x1="4" y1="12" x2="20" y2="12"
            class="origin-center transition-transform duration-300 ease-out motion-reduce:transition-none"
            [ngClass]="menuOpen ? 'rotate-45' : '-translate-y-[6px]'" />

          <!-- Línea del medio -->
          <line
            x1="4" y1="12" x2="20" y2="12"
            class="origin-center transition-all duration-200 ease-out motion-reduce:transition-none"
            [ngClass]="menuOpen ? 'opacity-0 scale-x-0' : 'opacity-100 scale-x-100'" />

          <!-- Línea inferior -->
          <line
            x1="4" y1="12" x2="20" y2="12"
            class="origin-center transition-transform duration-300 ease-out motion-reduce:transition-none"
            [ngClass]="menuOpen ? '-rotate-45' : 'translate-y-[6px]'" />

        </svg>

      </button>

    </div>
  </div>

  <!-- Menú móvil: panel flotante bajo el header (no empuja el contenido) -->
  <div
    id="mobile-menu"
    class="md:hidden absolute inset-x-0 top-full grid rounded-b-2xl bg-white border-b transition-[grid-template-rows,opacity] duration-300 ease-out motion-reduce:transition-none"
    [ngClass]="menuOpen
      ? 'grid-rows-[1fr] opacity-100 border-gray-200 shadow-xl'
      : 'grid-rows-[0fr] opacity-0 border-transparent pointer-events-none'"
    [attr.inert]="menuOpen ? null : ''">

    <div class="overflow-hidden">

      <nav class="flex flex-col gap-1 px-4 pt-3 pb-5" aria-label="Menú móvil">

        <a
          routerLink="/login"
          routerLinkActive="bg-gray-100 text-primary"
          (click)="closeMenu()"
          class="flex items-center justify-between rounded-xl px-4 py-3.5 text-base font-medium text-gray-700 hover:bg-gray-50 active:bg-gray-100 transition-colors">
          Iniciar sesión
          <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7" />
          </svg>
        </a>

        <a
          routerLink="/registro"
          routerLinkActive="bg-gray-100 text-primary"
          (click)="closeMenu()"
          class="flex items-center justify-between rounded-xl px-4 py-3.5 text-base font-medium text-gray-700 hover:bg-gray-50 active:bg-gray-100 transition-colors">
          Crear cuenta
          <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7" />
          </svg>
        </a>

        <div class="my-3 h-px bg-gray-100" role="separator"></div>

        <a
          routerLink="/reserva"
          (click)="closeMenu()"
          class="flex items-center justify-center rounded-xl border border-secondary px-4 py-3.5 text-base font-medium text-secondary hover:bg-secondary hover:text-white active:opacity-90 transition-colors">
          Consultar reserva
        </a>

        <a
          routerLink="/canchas"
          (click)="closeMenu()"
          class="mt-2 flex items-center justify-center rounded-xl bg-primary px-4 py-3.5 text-base font-semibold text-white shadow-sm hover:bg-hover-primary active:scale-[0.99] transition">
          Ver canchas
        </a>

      </nav>

    </div>
  </div>

</header>

@if (menuOpen) {
  <button
    type="button"
    class="md:hidden fixed inset-0 z-40 bg-black/30 backdrop-blur-[2px]"
    (click)="closeMenu()"
    aria-label="Cerrar menú">
  </button>
}
